# Nav2 parameters for traymover, option 15 speed mode 2.
# Adapted from traymover_robot_nav2/param/traymover_params/param_traymover_diff.yaml with:
#   - AMCL section removed (lidar_localization_ros2 provides map -> base_link)
#   - base_footprint -> base_link everywhere (URDF root is base_link)
#   - FAST_LIO /odom is the only navigation odometry source
#   - local costmap runs in odom for smooth control; global costmap stays in map
#   - dynamic obstacle / stop logic removed for simple point-to-point testing
#   - RPP rotate-to-heading enabled for in-place heading correction; reversing remains disabled
#   - velocity_smoother removed (reintroduce later if needed)

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    transform_tolerance: 0.6
    # Rewritten at launch to package-share behavior_trees/simple_*.xml.
    # Keep the keys present: RewrittenYaml updates existing params but does
    # not reliably add absent BT defaults, which lets Nav2 fall back to the
    # recovery trees that require behavior_server actions.
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    odom_topic: /odom
    failure_tolerance: 2.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "traymover_robot_nav::YawProgressChecker"
      required_movement_radius: 0.30
      required_movement_angle: 0.20
      movement_time_allowance: 8.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.30

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.35
      min_approach_linear_velocity: 0.15
      approach_velocity_scaling_dist: 0.6
      # Lookahead: how far ahead along the path RPP aims. Smaller = tighter
      # tracking (oscillation risk); larger = smoother but cuts corners.
      use_velocity_scaled_lookahead_dist: true
      # Longer lookahead reduces commanded curvature, lowering yaw rate without
      # adding another cmd_vel layer while keeping the existing direct chain.
      lookahead_dist: 1.40
      min_lookahead_dist: 1.10
      max_lookahead_dist: 2.60
      lookahead_time: 2.80
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.35
      rotate_to_heading_angular_vel: 0.90
      max_angular_accel: 0.8
      allow_reversing: false
      # Slow down on tight curves and near goal. Dynamic obstacle handling is
      # intentionally disabled for the current simple navigation pass.
      use_regulated_linear_velocity_scaling: true
      # Slow more aggressively on curves. RPP has no hard angular-velocity cap
      # in follow mode, so turn-speed limiting is done through lookahead and
      # curvature-based linear speed regulation.
      regulated_linear_scaling_min_radius: 3.20
      regulated_linear_scaling_min_speed: 0.0875
      use_cost_regulated_linear_velocity_scaling: false
      use_collision_detection: false
      transform_tolerance: 0.6
      # Required by nav2_regulated_pure_pursuit_controller internals:
      max_robot_pose_search_dist: 10.0
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.6
      use_sim_time: False
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[-0.40, -0.275], [-0.40, 0.275], [0.40, 0.275], [0.40, -0.275]]"
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.6
      use_sim_time: False
      footprint: "[[-0.40, -0.275], [-0.40, 0.275], [0.40, 0.275], [0.40, -0.275]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""   # set at launch via RewrittenYaml

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.50
      use_astar: false
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True
